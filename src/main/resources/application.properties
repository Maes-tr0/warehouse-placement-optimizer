spring.application.name=warehouse-placement-optimizer
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.events.kafka-enabled=${KAFKA_EVENTS_ENABLED:true}
app.events.dispatch-interval=${KAFKA_OUTBOX_DISPATCH_INTERVAL:2s}
app.events.dispatch-batch-size=${KAFKA_OUTBOX_BATCH_SIZE:50}
app.events.send-timeout=${KAFKA_SEND_TIMEOUT:10s}
app.events.processing-lease=${KAFKA_PROCESSING_LEASE:1m}
app.events.initial-retry-delay=${KAFKA_INITIAL_RETRY_DELAY:10s}
app.events.maximum-retry-delay=${KAFKA_MAXIMUM_RETRY_DELAY:15m}

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
app.search.enabled=${ELASTICSEARCH_AUDIT_ENABLED:true}
app.search.consumer-group=${ELASTICSEARCH_AUDIT_CONSUMER_GROUP:warehouse-audit-indexer}
app.search.maximum-page-size=${ELASTICSEARCH_AUDIT_MAXIMUM_PAGE_SIZE:200}

spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
app.cache.redis-enabled=${REDIS_CACHE_ENABLED:true}
app.cache.time-to-live=${REDIS_CACHE_TTL:5m}
app.cache.scheduler-lock-at-most=${REDIS_SCHEDULER_LOCK_AT_MOST:30m}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.notifications.email-enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}
app.notifications.from=${EMAIL_NOTIFICATIONS_FROM:warehouse-optimizer@localhost}
app.notifications.recipients=${EMAIL_NOTIFICATION_RECIPIENTS:admin@example.com}
app.notifications.consumer-group=${EMAIL_NOTIFICATION_CONSUMER_GROUP:warehouse-optimization-email}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ROOT_ADMIN,ADMIN
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Warehouse placement and relocation optimization backend

logging.structured.format.console=${STRUCTURED_LOG_FORMAT:logstash}
spring.thymeleaf.check-template-location=false

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.full-name=${APP_ADMIN_FULL_NAME:System Admin}

app.placement.recommendation-ttl-minutes=${PLACEMENT_RECOMMENDATION_TTL_MINUTES:15}

app.optimization.threshold-percent=${OPTIMIZATION_THRESHOLD_PERCENT:60}
app.optimization.lookback-days=${OPTIMIZATION_LOOKBACK_DAYS:730}
app.optimization.recency-half-life-days=${OPTIMIZATION_RECENCY_HALF_LIFE_DAYS:365}
app.optimization.seasonal-window-days=${OPTIMIZATION_SEASONAL_WINDOW_DAYS:45}
app.optimization.minimum-demand-observations=${OPTIMIZATION_MINIMUM_DEMAND_OBSERVATIONS:30}
app.optimization.target-percent=${OPTIMIZATION_TARGET_PERCENT:85}
app.optimization.maximum-plan-steps=${OPTIMIZATION_MAXIMUM_PLAN_STEPS:30}
app.optimization.minimum-time-saving-seconds=${OPTIMIZATION_MINIMUM_TIME_SAVING_SECONDS:1}
app.optimization.analysis-cron=${OPTIMIZATION_ANALYSIS_CRON:0 0 2 * * *}
app.optimization.analysis-zone=${OPTIMIZATION_ANALYSIS_ZONE:Europe/Amsterdam}

app.demand-forecast.enabled=${DEMAND_FORECAST_ENABLED:true}
app.demand-forecast.forecast-horizon-days=${DEMAND_FORECAST_HORIZON_DAYS:14}
app.demand-forecast.validation-days=${DEMAND_FORECAST_VALIDATION_DAYS:60}
app.demand-forecast.maximum-lookback-days=${DEMAND_FORECAST_MAXIMUM_LOOKBACK_DAYS:1095}
app.demand-forecast.minimum-article-history-days=${DEMAND_FORECAST_MINIMUM_ARTICLE_HISTORY_DAYS:90}
app.demand-forecast.minimum-training-samples=${DEMAND_FORECAST_MINIMUM_TRAINING_SAMPLES:100}
app.demand-forecast.minimum-validation-samples=${DEMAND_FORECAST_MINIMUM_VALIDATION_SAMPLES:20}
app.demand-forecast.maximum-tree-depth=${DEMAND_FORECAST_MAXIMUM_TREE_DEPTH:8}
app.demand-forecast.minimum-improvement-percent=${DEMAND_FORECAST_MINIMUM_IMPROVEMENT_PERCENT:2}
app.demand-forecast.minimum-retraining-interval-days=${DEMAND_FORECAST_MINIMUM_RETRAINING_INTERVAL_DAYS:30}
app.demand-forecast.maximum-retraining-interval-days=${DEMAND_FORECAST_MAXIMUM_RETRAINING_INTERVAL_DAYS:90}
app.demand-forecast.new-observations-threshold=${DEMAND_FORECAST_NEW_OBSERVATIONS_THRESHOLD:200}
app.demand-forecast.stale-training-hours=${DEMAND_FORECAST_STALE_TRAINING_HOURS:24}
app.demand-forecast.training-cron=${DEMAND_FORECAST_TRAINING_CRON:0 30 3 * * *}
app.demand-forecast.training-zone=${DEMAND_FORECAST_TRAINING_ZONE:Europe/Amsterdam}
