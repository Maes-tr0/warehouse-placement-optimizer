<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Movement history')}"></head>
<body data-page="admin-movements" data-role="admin"><div class="app-shell"><aside th:replace="~{fragments/layout :: adminSidebar('movements')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Movement history','POSTGRESQL OPERATION LOG')}" ></header><div class="content">
<article class="panel"><div class="section-head"><div><p class="eyebrow">WAREHOUSE OPERATIONS</p><h2>Complete pallet movement history</h2><p>Review putaway, relocation, temporary moves, merges, and removals recorded in PostgreSQL.</p></div><div class="filters"><input id="movementSearch" placeholder="Pallet, article, location, or plan"><select id="movementType"><option value="">All movement types</option><option value="PUTAWAY">Putaway</option><option value="RELOCATION">Relocation</option><option value="TEMPORARY_RELOCATION">Temporary relocation</option><option value="MERGE">Merge</option><option value="REMOVAL">Removal</option></select><button class="button subtle" data-load-movements>Refresh</button></div></div>
<div class="table-wrap"><table><thead><tr><th>Time</th><th>Type</th><th>Pallet / article</th><th>Movement</th><th>Quantity</th><th>Plan</th><th>Performed by</th></tr></thead><tbody id="movementsTable"></tbody></table></div></article>
</div></main></div><div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
