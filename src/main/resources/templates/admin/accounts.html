<!doctype html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Користувачі')}"></head>
<body data-page="admin-accounts" data-role="admin"><div class="app-shell"><aside th:replace="~{fragments/layout :: adminSidebar('accounts')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Користувачі','РОЛІ ТА ДОСТУП')}"></header><div class="content">
<div class="section-toolbar"><div><h2>Облікові записи</h2><p>Керуйте ролями адміністратора й оператора, активуйте або блокуйте доступ.</p></div><button class="button primary" data-dialog-open="accountDialog">+ Додати користувача</button></div>
<article class="panel"><div class="table-wrap"><table><thead><tr><th>Користувач</th><th>Роль</th><th>Статус</th><th>Створено</th><th>Оновлено</th><th></th></tr></thead><tbody id="accountsTable"></tbody></table></div></article>
</div></main></div>
<dialog id="accountDialog"><form id="accountForm" class="dialog-card"><div class="dialog-head"><div><p class="eyebrow">ОБЛІКОВИЙ ЗАПИС</p><h2 id="accountDialogTitle">Новий користувач</h2></div><button type="button" class="icon-button" data-dialog-close>×</button></div><input name="id" type="hidden"><label>Email<input name="email" type="email" required></label><label>Повне ім'я<input name="fullName" required></label><label>Пароль<input name="password" type="password" minlength="6"></label><label>Роль<select name="role"><option value="OPERATOR">Оператор</option><option value="ADMIN">Адміністратор</option><option value="ROOT_ADMIN">Головний адміністратор</option></select></label><button class="button primary wide">Зберегти користувача</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
