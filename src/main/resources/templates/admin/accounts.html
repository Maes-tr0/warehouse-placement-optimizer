<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Users')}"></head>
<body data-page="admin-accounts" data-role="admin"><div class="app-shell"><aside th:replace="~{fragments/layout :: adminSidebar('accounts')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Users','ROLES AND ACCESS')}"></header><div class="content">
<div class="section-toolbar"><div><h2>User accounts</h2><p>Manage administrator and operator roles, activate accounts, or block access.</p></div><button class="button primary" data-dialog-open="accountDialog">+ Add user</button></div>
<article class="panel"><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Created</th><th>Updated</th><th></th></tr></thead><tbody id="accountsTable"></tbody></table></div></article>
</div></main></div>
<dialog id="accountDialog"><form id="accountForm" class="dialog-card"><div class="dialog-head"><div><p class="eyebrow">USER ACCOUNT</p><h2 id="accountDialogTitle">New user</h2></div><button type="button" class="icon-button" data-dialog-close>×</button></div><input name="id" type="hidden"><label>Email<input name="email" type="email" required></label><label>Full name<input name="fullName" required></label><label>Password<input name="password" type="password" minlength="6" required></label><label>Role<select name="role"><option value="OPERATOR">Operator</option><option sec:authorize="hasRole('ROOT_ADMIN')" value="ADMIN">Administrator</option></select></label><button class="button primary wide">Save user</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
