<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Articles and pallets')}"></head>
<body data-page="admin-inventory" data-role="admin"><div class="app-shell"><aside th:replace="~{fragments/layout :: adminSidebar('inventory')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Articles and pallets','CATALOG AND INVENTORY')}"></header><div class="content">
<div class="tabs page-tabs"><button class="tab active" data-tab="articles">Article catalog</button><button class="tab" data-tab="containers">Warehouse pallets</button></div>
<section class="tab-panel active" id="tab-articles"><article class="panel"><div class="section-head"><div><p class="eyebrow">ARTICLE CATALOG</p><h2>Articles</h2><p>Dimensions and weight are used to validate storage location compatibility.</p></div><button class="button primary" data-dialog-open="articleDialog">+ Add article</button></div><div class="table-wrap"><table><thead><tr><th>Article number</th><th>Name</th><th>Unit</th><th>Dimensions</th><th>Weight</th><th>Max per pallet</th><th></th></tr></thead><tbody id="articlesTable"></tbody></table></div></article></section>
<section class="tab-panel" id="tab-containers"><article class="panel"><div class="section-head"><div><p class="eyebrow">CURRENT INVENTORY</p><h2>Pallets</h2></div><div class="filters"><input id="containerSearch" placeholder="Pallet or article"><button class="button subtle" data-load-containers>Refresh</button></div></div><div class="table-wrap"><table><thead><tr><th>Pallet</th><th>Article</th><th>Quantity</th><th>Weight / height</th><th>Location</th><th>State</th></tr></thead><tbody id="containersTable"></tbody></table></div></article></section>
</div></main></div>
<dialog id="articleDialog"><form id="articleForm" class="dialog-card"><div class="dialog-head"><div><p class="eyebrow">ARTICLE</p><h2 id="articleDialogTitle">New article</h2></div><button type="button" class="icon-button" data-dialog-close>×</button></div><input name="id" type="hidden"><div class="form-grid"><label>Article number<input name="articleNumber" inputmode="numeric" pattern="[0-9]+" required></label><label>Name<input name="name" required></label><label>Unit<select name="unitType"><option value="PCS">Pieces</option><option value="BOX">Boxes</option></select></label><label>Width, mm<input name="unitWidthMm" type="number" required></label><label>Length, mm<input name="unitLengthMm" type="number" required></label><label>Height, mm<input name="unitHeightMm" type="number" required></label><label>Weight, kg<input name="unitWeightKg" type="number" step="0.001" required></label><label>Max per pallet<input name="maxQuantityPerPallet" type="number" required></label></div><button class="button primary wide">Save article</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
