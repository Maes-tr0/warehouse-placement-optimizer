<!doctype html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Товари та палети')}"></head>
<body data-page="admin-inventory" data-role="admin"><div class="app-shell"><aside th:replace="~{fragments/layout :: adminSidebar('inventory')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Товари та палети','ДОВІДНИК І ЗАЛИШКИ')}"></header><div class="content">
<div class="tabs page-tabs"><button class="tab active" data-tab="articles">Довідник товарів</button><button class="tab" data-tab="containers">Палети на складі</button></div>
<section class="tab-panel active" id="tab-articles"><article class="panel"><div class="section-head"><div><p class="eyebrow">ТОВАРНИЙ ДОВІДНИК</p><h2>Артикули</h2><p>Габарити й вага використовуються для перевірки сумісності з локаціями.</p></div><button class="button primary" data-dialog-open="articleDialog">+ Додати товар</button></div><div class="table-wrap"><table><thead><tr><th>Артикул</th><th>Назва</th><th>Одиниця</th><th>Розміри</th><th>Вага</th><th>Макс. на палеті</th><th></th></tr></thead><tbody id="articlesTable"></tbody></table></div></article></section>
<section class="tab-panel" id="tab-containers"><article class="panel"><div class="section-head"><div><p class="eyebrow">ПОТОЧНІ ЗАЛИШКИ</p><h2>Палети</h2></div><div class="filters"><input id="containerSearch" placeholder="Палета або артикул"><button class="button subtle" data-load-containers>Оновити</button></div></div><div class="table-wrap"><table><thead><tr><th>Палета</th><th>Товар</th><th>Кількість</th><th>Вага / висота</th><th>Локація</th><th>Стан</th></tr></thead><tbody id="containersTable"></tbody></table></div></article></section>
</div></main></div>
<dialog id="articleDialog"><form id="articleForm" class="dialog-card"><div class="dialog-head"><div><p class="eyebrow">ТОВАР</p><h2 id="articleDialogTitle">Новий товар</h2></div><button type="button" class="icon-button" data-dialog-close>×</button></div><input name="id" type="hidden"><div class="form-grid"><label>Артикул<input name="articleNumber" inputmode="numeric" pattern="[0-9]+" required></label><label>Назва<input name="name" required></label><label>Одиниця<select name="unitType"><option value="PCS">Штуки</option><option value="BOX">Коробки</option></select></label><label>Ширина, мм<input name="unitWidthMm" type="number" required></label><label>Довжина, мм<input name="unitLengthMm" type="number" required></label><label>Висота, мм<input name="unitHeightMm" type="number" required></label><label>Вага, кг<input name="unitWeightKg" type="number" step="0.001" required></label><label>Макс. на палеті<input name="maxQuantityPerPallet" type="number" required></label></div><button class="button primary wide">Зберегти товар</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
