<!doctype html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Палети на складі')}"></head>
<body data-page="operator-inventory" data-role="operator"><div class="app-shell"><aside th:replace="~{fragments/layout :: operatorSidebar('inventory')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Палети на складі','ПОШУК І КОРИГУВАННЯ ДАНИХ')}"></header><div class="content">
<article class="panel"><div class="section-head"><div><p class="eyebrow">ПОТОЧНІ ЗАЛИШКИ</p><h2>Знайти палету або товар</h2><p>Перевіряйте кількість, габарити, стан і фактичну локацію.</p></div><div class="filters"><input id="containerSearch" placeholder="Номер палети або артикул" autofocus><select id="containerStatus"><option value="">Усі стани</option><option value="WAITING_FOR_PLACEMENT">Очікують розміщення</option><option value="STORED">Розміщені</option><option value="MERGED">Об'єднані</option><option value="REMOVED">Списані</option></select><button class="button subtle" data-load-containers>Оновити</button></div></div><div class="table-wrap"><table><thead><tr><th>Палета</th><th>Товар</th><th>Кількість</th><th>Вага / висота</th><th>Локація</th><th>Стан</th><th></th></tr></thead><tbody id="containersTable"></tbody></table></div></article>
</div></main></div>
<dialog id="containerDialog"><form id="containerForm" class="dialog-card"><div class="dialog-head"><div><p class="eyebrow">КОРИГУВАННЯ</p><h2 id="containerDialogTitle">Дані палети</h2></div><button type="button" class="icon-button" data-dialog-close>×</button></div><input name="containerNumber" type="hidden"><div class="form-grid"><label>Кількість<input name="quantity" type="number" min="1" required></label><label>Вага, кг<input name="weightKg" type="number" step="0.01" min="0.01" required></label><label>Висота, мм<input name="heightMm" type="number" min="1" required></label></div><button class="button primary wide">Зберегти зміни</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
