<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Warehouse pallets')}"></head>
<body data-page="operator-inventory" data-role="operator"><div class="app-shell"><aside th:replace="~{fragments/layout :: operatorSidebar('inventory')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Warehouse pallets','SEARCH AND DATA CORRECTION')}"></header><div class="content">
<span id="containerManagementPermission" hidden sec:authorize="hasAnyRole('ROOT_ADMIN','ADMIN')"></span>
<article class="panel"><div class="section-head"><div><p class="eyebrow">CURRENT INVENTORY</p><h2>Find pallet or article</h2><p>Check quantity, dimensions, status, and physical location.</p></div><div class="filters"><input id="containerSearch" placeholder="Pallet number or article" autofocus><select id="containerStatus"><option value="">All statuses</option><option value="WAITING_FOR_PLACEMENT">Waiting for placement</option><option value="STORED">Stored</option><option value="MERGED">Merged</option><option value="REMOVED">Removed</option></select><button class="button subtle" data-load-containers>Refresh</button></div></div><div class="table-wrap"><table><thead><tr><th>Pallet</th><th>Article</th><th>Quantity</th><th>Weight / height</th><th>Location</th><th>State</th><th sec:authorize="hasAnyRole('ROOT_ADMIN','ADMIN')">Actions</th></tr></thead><tbody id="containersTable"></tbody></table></div></article>
</div></main></div>
<dialog id="containerDialog" sec:authorize="hasAnyRole('ROOT_ADMIN','ADMIN')"><form id="containerForm" class="dialog-card"><div class="dialog-head"><div><p class="eyebrow">CORRECTION</p><h2 id="containerDialogTitle">Pallet data</h2></div><button type="button" class="icon-button" data-dialog-close>×</button></div><input name="containerNumber" type="hidden"><div class="form-grid"><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Weight, kg<input name="weightKg" type="number" step="0.01" min="0.01" required></label><label>Height, mm<input name="heightMm" type="number" min="1" required></label></div><button class="button primary wide">Save changes</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
