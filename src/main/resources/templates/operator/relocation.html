<!doctype html><html lang="uk" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Перестановка палет')}"></head>
<body data-page="operator-relocation" data-role="operator"><div class="app-shell"><aside th:replace="~{fragments/layout :: operatorSidebar('relocation')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Виконати перестановку','ЗАТВЕРДЖЕНИЙ ПЛАН ОПТИМІЗАЦІЇ')}"></header><div class="content">
<div class="operator-notice"><span>!</span><div><b>Виконуйте тільки поточний крок</b><p>Номери палети й нової локації мають бути підтверджені фактичним скануванням.</p></div></div>
<div class="panel-grid equal"><article class="panel"><p class="eyebrow">КРОК 1</p><h2>Відкрити план</h2><form id="currentStepForm" class="inline-form"><input name="planCode" placeholder="OPT-..." required autofocus><button class="button primary">Показати завдання</button></form><div id="currentStepCard" class="empty-state"><div><b>План не відкрито</b><p>Відскануйте або введіть код затвердженого плану.</p></div></div></article>
<article class="panel"><p class="eyebrow">КРОК 2</p><h2>Підтвердити переміщення</h2><form id="completeStepForm" class="form-grid"><label>Код плану<input name="planCode" readonly required></label><label>Відсканована палета<input name="sourceContainerNumber" required></label><label>Нова локація<input name="targetStoragePlaceCode" required></label><label>Цільова палета <small>для об'єднання</small><input name="targetContainerNumber"></label><button class="button accent wide">Підтвердити та отримати наступний крок</button></form></article></div>
</div></main></div><div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
