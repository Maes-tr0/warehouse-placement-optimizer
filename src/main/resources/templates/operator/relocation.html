<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Pallet relocation')}"></head>
<body data-page="operator-relocation" data-role="operator"><div class="app-shell"><aside th:replace="~{fragments/layout :: operatorSidebar('relocation')}"></aside><main class="workspace"><header th:replace="~{fragments/layout :: topbar('Execute relocation','APPROVED OPTIMIZATION PLAN')}"></header><div class="content">
<div class="operator-notice"><span>!</span><div><b>Execute only the current step</b><p>The pallet number and destination location must be confirmed by physical scans.</p></div></div>
<div class="panel-grid equal"><article class="panel"><p class="eyebrow">STEP 1</p><h2>Open plan</h2><form id="currentStepForm" class="inline-form"><input name="planCode" placeholder="OPT-..." required autofocus><button class="button primary">Show task</button></form><div id="currentStepCard" class="empty-state"><div><b>No plan opened</b><p>Scan or enter the approved plan code.</p></div></div></article>
<article class="panel"><p class="eyebrow">STEP 2</p><h2>Confirm relocation</h2><form id="completeStepForm" class="form-grid"><label>Plan code<input name="planCode" readonly required></label><label>Scanned pallet<input name="sourceContainerNumber" required></label><label>New location<input name="targetStoragePlaceCode" required></label><label>Target pallet <small>for merging</small><input name="targetContainerNumber"></label><button class="button accent wide">Confirm and get next step</button></form></article></div>
</div></main></div><div id="toastStack" class="toast-stack"></div><script src="/assets/portal.js" defer></script></body></html>
